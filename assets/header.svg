<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/><stop offset="0.6" stop-color="#103a4a"/><stop offset="1" stop-color="#1d6b5a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cffcb" stop-opacity="0.15"/><stop offset="0.5" stop-color="#7cffcb" stop-opacity="0.35"/><stop offset="1" stop-color="#b388ff" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7cffcb" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .name { font: 800 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: 2px; }
      .sub  { font: 500 21px Consolas, 'Fira Code', 'Courier New', monospace; fill: #c3fff0; }
      .tag  { font: 600 14px Consolas, 'Fira Code', 'Courier New', monospace; fill: #7cffcb; letter-spacing: 3px; }
      .fade { animation: fade 1.4s ease-out both; }
      .fade2 { animation: fade 1.4s ease-out 0.5s both; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .node { animation: pulse 2.4s ease-in-out infinite; }
      .n2 { animation-delay: .8s; } .n3 { animation-delay: 1.6s; }
      @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <g stroke="#7cffcb" stroke-opacity="0.35" fill="none" stroke-width="1.5">
    <path d="M60 40H180L210 70H300"/><path d="M1140 50H1020L990 80H900"/><path d="M80 200H160L190 170H260"/>
  </g>
  <g fill="#7cffcb" filter="url(#glow)">
    <circle class="node" cx="300" cy="70" r="4"/><circle class="node n2" cx="900" cy="80" r="4" fill="#b388ff"/><circle class="node n3" cx="260" cy="170" r="4"/>
  </g>
  <path fill="url(#wave)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 215 C200 185 400 245 600 215 C800 185 1000 245 1200 215 V260 H0Z;M0 215 C200 245 400 185 600 215 C800 245 1000 185 1200 215 V260 H0Z;M0 215 C200 185 400 245 600 215 C800 185 1000 245 1200 215 V260 H0Z"/>
  </path>
  <path fill="#7cffcb" fill-opacity="0.12">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 230 C300 250 500 210 800 232 C1000 246 1100 224 1200 230 V260 H0Z;M0 230 C300 210 500 250 800 228 C1000 214 1100 236 1200 230 V260 H0Z;M0 230 C300 250 500 210 800 232 C1000 246 1100 224 1200 230 V260 H0Z"/>
  </path>
  <text class="tag" x="600" y="62" text-anchor="middle">&lt;/&gt;  FULL-STACK  ·  AUTOMATION  ·  AI SYSTEMS</text>
  <text class="name" x="600" y="132" text-anchor="middle" filter="url(#glow)">Sujal Ranjan</text>
  <text class="sub" x="600" y="174" text-anchor="middle">$ building software that watches, learns &amp; automates<tspan class="cursor" fill="#7cffcb"> ▌</tspan></text>
</svg>
